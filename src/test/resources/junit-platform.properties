# Parallel execution is opt-in: `mvn test -Djunit.jupiter.execution.parallel.enabled=true`.
#
# The default lives here rather than in the POM's surefire configuration so that there is exactly
# one source of truth for it. The JUnit Platform reads a JVM system property in preference to this
# file, so the -D above overrides the line below; a value injected through Surefire's
# systemPropertyVariables would win over the -D instead and silently ignore it.
#
# Off by default so that a full run stays comfortably inside GitLab's API rate limits. Every test
# provisions its own data - including its own labels - so the suite is safe to parallelise when the
# environment allows it.
junit.jupiter.execution.parallel.enabled = false
junit.jupiter.execution.parallel.mode.default = concurrent
junit.jupiter.execution.parallel.mode.classes.default = concurrent
junit.jupiter.execution.parallel.config.strategy = fixed
junit.jupiter.execution.parallel.config.fixed.parallelism = 4
